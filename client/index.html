<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omega TK Code Assistant</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
            colors: {
              primary: '#7c3aed',
              'primary-dark': '#6d28d9',
              'primary-light': '#ede9fe',
              sidebar: '#1a1a2e',
              'sidebar-2': '#16213e',
              'sidebar-3': '#0f3460',
            },
          },
        },
      }
    </script>

    <!-- highlight.js: dark theme + Python -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/languages/python.min.js"></script>

    <style>
      * { box-sizing: border-box; }
      body { font-family: 'Inter', ui-sans-serif, system-ui; }
      .hljs { background: transparent !important; }

      @keyframes dot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40%            { transform: translateY(-6px); opacity: 1; }
      }
      .dot-bounce { animation: dot-bounce 1.2s infinite ease-in-out; }

      /* Custom scrollbar for panels */
      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
      .custom-scroll::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

      /* Sidebar scrollbar */
      .sidebar-scroll::-webkit-scrollbar { width: 3px; }
      .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
      .sidebar-scroll::-webkit-scrollbar-thumb { background: #2d2d4e; border-radius: 2px; }

      /* Smooth panel slide transition */
      .panel-slide { transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
